<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản trị | Hanabi</title>
    <meta name="author" content="Vũ Hoài Nam">
    <meta name="copyright" content="© 2026 Vũ Hoài Nam">
    <!-- Trang quản trị của chủ trang: không đưa lên công cụ tìm kiếm -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#0b0d12">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="./src/assets/scss/admin.scss">
</head>

<body>
    <!-- Chưa đăng nhập, không có quyền, bản không có quản trị -->
    <main id="gate" class="gate">
        <div class="gate__card">
            <a class="brand" href="./"><img src="/favicon.svg" alt="" width="40" height="40"><span><b>Hanabi</b><small>Quản trị</small></span></a>
            <h1>Đăng nhập quản trị</h1>
            <p id="gate-message">Đang kiểm tra...</p>
            <div id="gate-google" class="google-button"></div>
            <button type="button" id="gate-logout" class="btn hide">Đăng xuất, dùng tài khoản khác</button>
        </div>
        <p class="gate__foot">© 2026 Vũ Hoài Nam · <a href="./">Về trang chủ</a></p>
    </main>

    <div id="app" class="shell hide">
        <aside id="sidebar" class="sidebar" aria-label="Điều hướng quản trị">
            <a class="brand" href="./"><img src="/favicon.svg" alt="" width="32" height="32"><span><b>Hanabi</b><small>Quản trị</small></span></a>
            <nav class="sidebar__nav">
                <span class="sidebar__group">Tổng quan</span>
                <button type="button" data-tab="overview"><i class="fas fa-chart-pie"></i><span>Bảng điều khiển</span></button>
                <span class="sidebar__group">Nội dung</span>
                <button type="button" data-tab="scripts"><i class="fas fa-wand-magic-sparkles"></i><span>Kịch bản</span><em data-count="scripts"></em></button>
                <button type="button" data-tab="replies"><i class="fas fa-heart"></i><span>Lời cảm ơn</span><em data-count="replies"></em></button>
                <span class="sidebar__group">Tài khoản</span>
                <button type="button" data-tab="users"><i class="fas fa-users"></i><span>Người dùng</span><em data-count="users"></em></button>
                <span class="sidebar__group">Kho</span>
                <button type="button" data-tab="music"><i class="fas fa-music"></i><span>Kho nhạc</span></button>
                <button type="button" data-tab="images"><i class="fas fa-image"></i><span>Kho ảnh</span></button>
            </nav>
            <div class="sidebar__me">
                <span id="me-avatar" class="avatar"></span>
                <div><strong id="me-name"></strong><small id="me-email"></small></div>
                <button type="button" class="btn btn--icon btn--ghost" id="btn-logout" title="Đăng xuất" aria-label="Đăng xuất"><i class="fas fa-arrow-right-from-bracket"></i></button>
            </div>
        </aside>
        <div class="sidebar-backdrop" data-close-nav></div>

        <div class="main">
            <header class="topbar">
                <button type="button" class="btn btn--icon btn--ghost topbar__menu" data-open-nav aria-label="Mở menu"><i class="fas fa-bars"></i></button>
                <div class="topbar__heading">
                    <h1 id="page-title"></h1>
                    <p id="page-subtitle"></p>
                </div>
                <div id="page-actions" class="topbar__actions"></div>
            </header>
            <!-- Nội dung từng mục: admin.js dựng -->
            <main id="panel" class="content"></main>
        </div>
    </div>

    <!-- Hộp thoại dùng chung: chi tiết kịch bản, xác nhận, thêm và sửa mục kho -->
    <dialog id="modal" class="modal" aria-labelledby="modal-title">
        <div class="modal__head">
            <h2 id="modal-title"></h2>
            <button type="button" class="btn btn--icon btn--ghost" data-modal-close aria-label="Đóng"><i class="fas fa-xmark"></i></button>
        </div>
        <div id="modal-body" class="modal__body"></div>
        <div id="modal-foot" class="modal__foot"></div>
    </dialog>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script type="module" src="./src/assets/js/admin.js"></script>
</body>

</html>
