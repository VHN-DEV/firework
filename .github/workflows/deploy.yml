name: Kiểm thử và triển khai lên GitHub Pages

# Mỗi lần push lên main: cài thư viện, build, chạy kiểm thử tự động; đạt hết mới triển khai.
# Pull request: chỉ build và kiểm thử, không triển khai.
on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # Máy chạy ubuntu-latest có sẵn Google Chrome và PHP
      - name: Kiểm thử tự động
        run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome

      # Build lại để bản triển khai chắc chắn không lẫn dữ liệu kiểm thử. Trang chính đã chuyển sang Cloudflare Workers
      # (SITE_URL trong seo-plugin.js): MOVED_FROM làm mỗi trang trên GitHub Pages tự mở trang tương ứng ở trang chính.
      # Bỏ dòng env này nếu muốn GitHub Pages chạy độc lập như trước.
      - name: Build bản triển khai
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm run build
        env:
          MOVED_FROM: https://vhn-dev.github.io/firework/

      - uses: actions/configure-pages@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
