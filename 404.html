    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background:

            font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }
        .sky span {
            position: fixed;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: #fff;
            opacity: 0.5;
            animation: twinkle 3s ease-in-out infinite;
        }
        @keyframes twinkle { 50% { opacity: 0.08; } }
        main { position: relative; max-width: 460px; }
        .logo { width: 84px; height: 84px; border-radius: 22px; box-shadow: 0 16px 40px -12px rgba(255, 95, 162, 0.6); }
        .code {
            margin: 22px 0 4px;
            font-size: 76px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.04em;
            background: linear-gradient(120deg, #ffd27a, #ff6aa8 50%, #8b7bff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        h1 { margin: 0 0 10px; color: #fff; font-size: 24px; letter-spacing: -0.01em; }
        p { margin: 0 0 28px; color: #9ba3b9; }
        .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .actions a {
            padding: 12px 22px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
            font-weight: 600;
            text-decoration: none;
        }
        .actions a:first-child {
            border: 0;
            color: #1a0b16;
            background: linear-gradient(120deg, #ffd27a, #ff6aa8 50%, #8b7bff);
            box-shadow: 0 10px 28px -10px rgba(255, 106, 168, 0.8);
        }
        .brand { margin-top: 36px; color: #6f7891; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; }
        @media (prefers-reduced-motion: reduce) { .sky span { animation: none; } }
    </style>

        <h1>Bầu trời này chưa có pháo hoa</h1>
        <p>Trang bạn tìm không có ở đây: có thể đường dẫn bị gõ sai hoặc trang đã được đổi chỗ.</p>
        <div class="actions">
            <a data-to="" href="__SITE_URL__">Về trang chủ</a>
            <a data-to="demo" href="__SITE_URL__demo">Xem màn pháo hoa mẫu</a>

    </main>
    <script>
        // Gốc của web: thư mục chứa trang trên GitHub Pages (vd /firework/), thư mục dist khi chạy thử trên máy, hoặc /
        (function () {
            var path = location.pathname;
            var site = new URL('__SITE_URL__').pathname;
            var dist = path.indexOf('/dist/');
            var root = dist >= 0 ? path.slice(0, dist + 6) : path.indexOf(site) === 0 ? site : '/';
            document.querySelectorAll('[data-to]').forEach(function (a) { a.href = root + a.getAttribute('data-to'); });
            var sky = document.querySelector('.sky');
            for (var i = 0; i < 40; i++) {
                var s = document.createElement('span');
                s.style.left = Math.random() * 100 + '%';
                s.style.top = Math.random() * 100 + '%';
                s.style.animationDelay = (Math.random() * 3).toFixed(2) + 's';
                sky.appendChild(s);
            }
        })();
    </script>
